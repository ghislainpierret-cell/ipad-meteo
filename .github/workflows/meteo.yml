name: Mise à jour météo

on:
  schedule:
    - cron: "7,37 * * * *"   # toutes les 30 min (à :07 et :37)
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

concurrency:
  group: meteo
  cancel-in-progress: false

jobs:
  meteo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Récupérer la météo d'Urcuit (Open-Meteo)
        run: |
          curl -fsS --retry 3 --max-time 30 -o meteo.tmp \
            "https://api.open-meteo.com/v1/forecast?latitude=43.487&longitude=-1.338&timezone=Europe%2FParis&forecast_days=5&current=temperature_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max"
          # On ne remplace le fichier que si la réponse est complète
          jq -e '.current.temperature_2m != null and (.daily.time | length) > 0' meteo.tmp > /dev/null
          mv meteo.tmp meteo.json

      - name: Publier
        run: |
          git config user.name "meteo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meteo.json
          git diff --cached --quiet && exit 0
          git commit -m "Météo $(TZ=Europe/Paris date '+%d/%m %H:%M')"
          git push
