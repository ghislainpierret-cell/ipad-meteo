name: Mise à jour météo

on:
  schedule:
    - cron: "7,37 * * * *"   # toutes les 30 min (à :07 et :37)
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

concurrency:
  group: meteo
  cancel-in-progress: false

jobs:
  meteo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fabriquer la page météo d'Urcuit (Open-Meteo)
        run: python3 gen.py index.html

      - name: Publier
        run: |
          git config user.name "meteo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Météo $(TZ=Europe/Paris date '+%d/%m %H:%M')"
          # Si le dépôt a bougé entre-temps (relance, autre exécution), on se
          # recale dessus en gardant la page qui vient d'être fabriquée.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main || exit 1
          done
          exit 1
